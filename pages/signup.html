<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Sign Up & Create Account - MAD DEV</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries" id="tailwind-cdn"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../css/base/global.css"/>
  <link rel="stylesheet" href="../css/base/components.css"/>
  <link rel="stylesheet" href="../css/base/responsive.css"/>

  <script>
    (function () {
      const htmlDoc = document.documentElement;
      htmlDoc.classList.remove('preload');
      htmlDoc.classList.add('app-ready');
    })();
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 antialiased relative overflow-y-auto">
  
  <!-- Glowing Background Orbs -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full filter blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full filter blur-3xl pointer-events-none"></div>

  <div class="max-w-lg w-full relative z-10 my-8">
    <!-- Brand Header -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-indigo-600 text-white shadow-xl shadow-indigo-500/30 mb-3">
        <span class="material-symbols-outlined text-3xl">terminal</span>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white">Join MAD DEV</h1>
      <p class="text-sm text-slate-400 mt-1">Create your isolated profile & connect your dev accounts</p>
    </div>

    <!-- Signup Card -->
    <div class="bg-slate-800/80 backdrop-blur-xl border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
      
      <!-- Alert Message Box -->
      <div id="signup-alert" class="hidden p-3.5 rounded-xl text-xs font-semibold"></div>

      <!-- Registration Form -->
      <form id="signup-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="signup-name">Full Name *</label>
          <input type="text" id="signup-name" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. Abhinav Dixit" required/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1" for="signup-email">Email Address *</label>
          <input type="email" id="signup-email" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="name@domain.com" required/>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" for="signup-password">Password *</label>
            <input type="password" id="signup-password" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Create password" required/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1" for="signup-confirm-password">Confirm Password *</label>
            <input type="password" id="signup-confirm-password" class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Confirm password" required/>
          </div>
        </div>

        <!-- Account Connections Header -->
        <div class="pt-2 border-t border-slate-700/60">
          <p class="text-xs font-bold text-indigo-400 uppercase tracking-wider mb-3">Connect Developer Accounts</p>

          <div class="space-y-3">
            <!-- GitHub Connection -->
            <div class="p-3.5 rounded-xl bg-slate-900/90 border border-slate-700 space-y-2">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <svg class="w-4 h-4 fill-current text-white" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                  <span class="text-xs font-bold text-white">GitHub Username</span>
                </div>
                <span id="github-verify-badge" class="text-[10px] text-slate-400">Optional</span>
              </div>
              <div class="relative">
                <span class="absolute left-3 top-2.5 text-slate-500 text-xs">@</span>
                <input type="text" id="signup-github-username" class="w-full pl-7 pr-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="e.g. torvalds"/>
              </div>
            </div>

            <!-- LeetCode Connection -->
            <div class="p-3.5 rounded-xl bg-slate-900/90 border border-slate-700 space-y-2">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="material-symbols-outlined text-amber-500 text-base">code</span>
                  <span class="text-xs font-bold text-white">LeetCode Handle</span>
                </div>
                <span id="leetcode-verify-badge" class="text-[10px] text-slate-400">Optional</span>
              </div>
              <div class="relative">
                <span class="absolute left-3 top-2.5 text-slate-500 text-xs">@</span>
                <input type="text" id="signup-leetcode-handle" class="w-full pl-7 pr-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="e.g. tourist"/>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 mt-4">
          <span class="material-symbols-outlined text-base">person_add</span>
          <span>Create Account & Start Building</span>
        </button>
      </form>

      <div class="flex items-center justify-between pt-2 border-t border-slate-700/60">
        <a href="login.html" class="text-xs text-indigo-400 hover:text-indigo-300 font-semibold transition-colors flex items-center gap-1">
          <span class="material-symbols-outlined text-sm">login</span>
          <span>Already have an account? Sign In</span>
        </a>
        <a href="../index.html" class="text-xs text-slate-400 hover:text-white transition-colors">
          Continue as Guest
        </a>
      </div>

    </div>
  </div>

  <script src="../js/core/utils.js"></script>
  <script src="../js/core/authService.js"></script>
  <script src="../js/core/databaseService.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signup-form');
      const alertBox = document.getElementById('signup-alert');

      if (form) {
        form.onsubmit = async (e) => {
          e.preventDefault();
          alertBox.classList.add('hidden');

          const name = document.getElementById('signup-name').value.trim();
          const email = document.getElementById('signup-email').value.trim();
          const pass = document.getElementById('signup-password').value;
          const confirmPass = document.getElementById('signup-confirm-password').value;
          const ghUser = document.getElementById('signup-github-username').value.trim();
          const lcHandle = document.getElementById('signup-leetcode-handle').value.trim();

          if (pass !== confirmPass) {
            showAlert('Passwords do not match. Please check and try again.', 'error');
            return;
          }

          if (pass.length < 6) {
            showAlert('Password must be at least 6 characters long.', 'error');
            return;
          }

          const res = await window.AuthService.signUp(email, pass, name, ghUser, lcHandle);
          if (res.success) {
            if (res.isExisting) {
              showAlert('Account already exists! Logging you in...', 'info');
            } else {
              showAlert('Account created successfully! Redirecting...', 'success');
            }
            setTimeout(() => {
              window.location.href = '../index.html';
            }, 800);
          } else {
            showAlert(res.error || 'Failed to create account.', 'error');
          }
        };
      }

      function showAlert(msg, type) {
        alertBox.textContent = msg;
        alertBox.className = `p-3.5 rounded-xl text-xs font-semibold ${type === 'error' ? 'bg-red-900/60 border border-red-500/40 text-red-200' : type === 'success' ? 'bg-emerald-900/60 border border-emerald-500/40 text-emerald-200' : 'bg-indigo-900/60 border border-indigo-500/40 text-indigo-200'}`;
        alertBox.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
